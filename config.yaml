appearance:
  css: |
    /* ===== 1. 隐藏终端滚动条（保留滚动功能，仅隐藏视觉） ===== */
    .xterm-viewport {
      scrollbar-width: none !important;  /* Firefox */
      -ms-overflow-style: none !important;  /* IE/Edge */
    }
    .xterm-viewport::-webkit-scrollbar,
    split-tab ::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }

    /* ===== 2. 分割线改细（Windows Terminal / tmux 风格） ===== */
    split-tab-spanner {
      background: transparent !important;
      opacity: 0;
      transition: background 0.15s, opacity 0.15s;
    }
    split-tab-spanner:hover,
    split-tab-spanner.active {
      background: var(--theme-primary) !important;
      opacity: 1;
    }
    /* 纵向分割线（左右分屏）：细竖线 */
    split-tab-spanner.h {
      width: 4px !important;
      margin-left: -2px !important;
    }
    /* 横向分割线（上下分屏）：细横线 */
    split-tab-spanner.v {
      height: 4px !important;
      margin-top: -2px !important;
    }

    /* ===== 3. 激活窗口的分割线着色（tmux 风格） ===== */
    split-tab > .child {
      border: 1px solid transparent !important;
      box-sizing: border-box;
    }
    split-tab > .child.focused {
      border-color: var(--theme-primary) !important;
    }

    /* ===== 4. 四角全圆角标签（pill 药丸形，上下都圆） ===== */
    /* tab-bar 保持与内容区协调的底色 */
    .main.content > .tab-bar {
      background: var(--theme-bg-more-2) !important;
    }

    /* 每个标签：四角全圆 + 主题色线圈 + 上下左右留间隙，像独立悬浮的药丸 */
    .tab-bar > .tabs tab-header {
      box-sizing: border-box !important;
      border: 1px solid var(--theme-primary) !important;  /* fallback */
      border: 1px solid color-mix(in srgb, var(--theme-primary) 45%, transparent) !important;
      border-radius: 12px !important;
      margin: 5px 3px !important;
      color: var(--theme-fg-more-2) !important;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease !important;
      /* 非 active 标签透明，融入 tab-bar */
      background: transparent !important;
    }
    .tab-bar > .tabs tab-header:hover {
      background: rgba(127, 127, 127, 0.18) !important;
      color: var(--theme-fg) !important;
      border-color: color-mix(in srgb, var(--theme-primary) 80%, transparent) !important;
    }

    /* active 标签：实色主题线圈 + 同色辉光 + 文字高亮 */
    .tab-bar > .tabs tab-header.active {
      background: rgba(127, 127, 127, 0.28) !important;
      color: var(--theme-fg) !important;
      border-color: var(--theme-primary) !important;
      box-shadow: 0 0 8px color-mix(in srgb, var(--theme-primary) 55%, transparent),
                  0 1px 4px rgba(0, 0, 0, 0.25) !important;
    }

    /* 顶部的 active 指示细条：药丸风格下隐藏，改用圆角+底色表达 */
    .tab-bar > .tabs tab-header .current-tab-indicator {
      display: none !important;
    }
    /* 底部色条贴合底部圆角（若某标签设置了 tab.color） */
    .tab-bar > .tabs tab-header .colorbar {
      border-radius: 0 0 12px 12px !important;
    }
